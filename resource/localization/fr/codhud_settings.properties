# ---------[ ROUND START ]---------
CoDHUD.RoundStart=Contrôles de manche

CoDHUD.RoundStart.Gamemode=Mode de jeu
CoDHUD.RoundStart.Info=Choisissez le mode de jeu.

CoDHUD.RoundStart.Start=Lancer la manche
CoDHUD.RoundStart.Start.desc=Une fois un mode de jeu sélectionné et les paramètres définis selon vos préférences, vous pouvez lancer le processus de début de manche.

CoDHUD.RoundStart.Notice=Êtes-vous sûr de vouloir lancer une nouvelle manche ?\nTous les scores seront réinitialisés et tous les joueurs réapparaîtront.
CoDHUD.RoundStart.Yes=Lancer la manche

CoDHUD.RoundStart.Timer=Minuteur de début de manche
CoDHUD.RoundStart.Timer.desc=Nombre de secondes d'intermission avant le début de la manche.

CoDHUD.RoundStart.Autobalance=Répartition aléatoire des factions au début de la manche
CoDHUD.RoundStart.Autobalance.desc=Si activé, tous les joueurs seront placés aléatoirement dans une faction valide au début de la manche.

CoDHUD.Scorelimit=Limite de score
CoDHUD.Scorelimit.desc=Définit la limite maximale de score affichée sur le compteur de score.\n\nMesuré en éliminations.

CoDHUD.Timelimit=Limite de temps
CoDHUD.Timelimit.desc=Définit la limite de temps avant la fin automatique de la manche.\n\nMesuré en minutes.\n\nMettre à 0 pour illimité.

CoDHUD.Autobalance.Amount=Limite d'équilibrage des équipes
CoDHUD.Autobalance.Amount.desc=Définit le nombre maximal de factions auxquelles les joueurs peuvent être automatiquement répartis.

CoDHUD.Autobalance.Amount.disable=Désactivé
CoDHUD.Autobalance.Amount.2=2 équipes
CoDHUD.Autobalance.Amount.3=3 équipes
CoDHUD.Autobalance.Amount.4=4 équipes

CoDHUD.RoundStart.Auto=Démarrer automatiquement une manche au lancement du serveur
CoDHUD.RoundStart.Auto.desc=Si activé, une nouvelle manche commencera immédiatement dès que le premier joueur rejoint le serveur.

CoDHUD.Admin.ResetTime=Réinitialiser le minuteur de manche
CoDHUD.Admin.ResetTime.desc=Réinitialise le minuteur de manche actuel à la valeur définie par la limite de temps.

CoDHUD.ForceEndRound=Forcer la fin de la manche
CoDHUD.ForceEndRound.desc=Cliquez ici si vous devez ou souhaitez terminer la manche avant que la limite de score ou de temps ne soit atteinte.

CoDHUD.ForceEndRound.Notice=Êtes-vous sûr de vouloir forcer la fin de la manche ?

# ---------[ ROUND END ]---------
CoDHUD.Admin.EndScreen=Activer "Fin de partie"
CoDHUD.Admin.EndScreen.desc=Active un système de fin de partie lorsque la limite de score est atteinte.

CoDHUD.Admin.EndScreen.StartNext=Lancer la prochaine manche après la fin de partie
CoDHUD.Admin.EndScreen.StartNext.desc=Si activé, une nouvelle manche commencera après la durée de fin de partie.\n\nSi désactivé, tous les joueurs réapparaîtront normalement.

CoDHUD.Admin.FriendlyFire=Activer le tir ami
CoDHUD.Admin.FriendlyFire.desc=Si activé, les joueurs de la même faction peuvent s'infliger des dégâts.\n\nS'applique uniquement en Match à mort en équipe.

