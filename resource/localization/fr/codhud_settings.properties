CoDHUD.Admin.RestrictType=Restreindre factions et type de HUD
CoDHUD.Admin.RestrictType.Choose=Choisir le jeu
CoDHUD.Admin.RestrictType.desc=Choisissez à quel titre CoD limiter les utilisateurs. Cela affecte le HUD et les factions disponibles.

CoDHUD.Admin.RestrictType.Warning=Attention !\nChanger de jeu entraînera les conséquences suivantes :\n- Les factions de tous les joueurs seront choisies aléatoirement.\n- Tous les scores des joueurs seront remis à 0.\n- Tous les joueurs seront tués et réapparaîtront.\n\nÊtes-vous sûr de vouloir changer de jeu ?

