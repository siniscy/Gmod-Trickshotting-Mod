CoDHUD.Type.ww2=WWII

CoDHUD.Admin.RestrictFactionChance=Restreindre le changement de faction
CoDHUD.Admin.RestrictFactionChance.desc=Définit quand les joueurs sont autorisés à changer de faction.

CoDHUD.Admin.RestrictFactionChance.disable=Impossible de changer
CoDHUD.Admin.RestrictFactionChance.freely=Changement libre
