CoDHUD.HUD=Paramètres du HUD

# Multiple
CoDHUD.HUD.Outline=Texte contouré
CoDHUD.HUD.Outline.desc=Active les textes contourés sur certains éléments pour améliorer la lisibilité dans les zones très lumineuses.

CoDHUD.HUD.Sound=Lire les effets sonores
CoDHUD.HUD.Sound.desc=Joue les effets sonores associés si le type de HUD le prend en charge.

CoDHUD.HUD.Time.Total=Durée d'affichage
CoDHUD.HUD.Time.Total.desc=Durée pendant laquelle la variable reste affichée après être complètement apparue avant de disparaître.

CoDHUD.HUD.Time.Fadein=Temps d'apparition
CoDHUD.HUD.Time.Fadein.desc=Durée nécessaire pour faire apparaître cette variable.

CoDHUD.HUD.Time.Fadeout=Temps de disparition
CoDHUD.HUD.Time.Fadeout.desc=Durée nécessaire pour faire disparaître cette variable.

# Scale
CoDHUD.HUD.Scale=Échelle de l'interface

CoDHUD.HUD.Scale.Enable=Multiplicateur d'échelle UI
CoDHUD.HUD.Scale.Enable.desc=Ajuste l'échelle des éléments d'interface utilisés par le HUD CoD.\n\nUtile pour les résolutions faibles ou ultra-larges.\n\n<color=255,255,100>Note</color> : le menu sera rechargé lors de l'application.\n\n<color=255,100,100>ATTENTION</color> : certains éléments peuvent être fortement désalignés si la valeur est trop élevée ou trop faible.

# Scoreboard
CoDHUD.HUD.Scoreboard=Tableau des scores

CoDHUD.HUD.Scoreboard.Enable=Activer le tableau des scores
CoDHUD.HUD.Scoreboard.Enable.desc=Active le tableau des scores. Affiche les factions actuellement occupées par tous les joueurs.

# Score Counter
CoDHUD.HUD.Scorecounter=Compteur de score

CoDHUD.HUD.Scorecounter.Enable=Activer le compteur de score
CoDHUD.HUD.Scorecounter.Enable.desc=Active un minuteur serveur, une icône de faction et les compteurs de score.\n\nCertains types de HUD n'affichent pas l'icône de faction.

# Medals
CoDHUD.HUD.Medals=Médailles

CoDHUD.HUD.Medals.Enable=Activer les médailles
CoDHUD.HUD.Medals.Enable.desc=Active les médailles obtenues en réalisant certaines actions comme des éliminations rapides ou des tirs à la tête.\n\nNotez que certains types de HUD n'affichent que du texte, tandis que d'autres affichent texte et icônes.

CoDHUD.HUD.Medals.Speedup=Accélérer si file d'attente longue
CoDHUD.HUD.Medals.Speedup.desc=Accélère la file des médailles lorsqu'il y en a beaucoup en attente.\n\nSelon le type de HUD, désactive aussi les effets sonores si plus de 3 médailles sont en file.

# Kill Feed
CoDHUD.HUD.Killfeed=Fil de kills

CoDHUD.HUD.Killfeed.Enable=Activer le fil de kills
CoDHUD.HUD.Killfeed.Enable.desc=Active le fil de kills.

# Minimap
CoDHUD.HUD.Minimap=Minicarte

CoDHUD.HUD.Minimap.Enable=Activer la minicarte
CoDHUD.HUD.Minimap.Enable.desc=Active la minicarte.

# Hitmarker
CoDHUD.HUD.Hitmarker=Indicateur de tir

CoDHUD.HUD.Hitmarker.Enable=Activer l'indicateur de tir
CoDHUD.HUD.Hitmarker.Enable.desc=Active l'indicateur de tir et son son associé.

# Weapon Info
CoDHUD.HUD.WeaponInfo=Infos arme

CoDHUD.HUD.WeaponInfo.Enable=Activer les infos arme
CoDHUD.HUD.WeaponInfo.Enable.desc=Active l'onglet d'informations de l'arme, affichant le nom et les munitions.\n\nCertains HUD intègrent aussi la boussole ici.

CoDHUD.HUD.WeaponPrompts.Enable=Activer les alertes d'arme
CoDHUD.HUD.WeaponPrompts.Enable.desc=Active les alertes d'arme, comme les notifications de munitions faibles.

# XP Counter
CoDHUD.HUD.XP=Notification XP

CoDHUD.HUD.XP.Enable=Activer les notifications XP
CoDHUD.HUD.XP.Enable.desc=Active les notifications XP.

# Target ID / IFF
CoDHUD.HUD.IFF=Identification ami ou ennemi

CoDHUD.HUD.IFF.Enable=Activer IFF
CoDHUD.HUD.IFF.Enable.desc=Active un système d'identification ami/ennemi affichant le nom de la cible au-dessus de sa tête lorsque vous la visez.

# Death Icon
CoDHUD.HUD.DeathIcon=Icône de mort

CoDHUD.HUD.DeathIcon.Enable=Activer l'icône de mort
CoDHUD.HUD.DeathIcon.Enable.desc=Active l'icône affichée lorsqu'un joueur de la même faction meurt.

# Chat
CoDHUD.HUD.Chat=Chat

CoDHUD.HUD.Chat.Enable=Activer le chat
CoDHUD.HUD.Chat.Enable.desc=Active le chat.

# Headers
CoDHUD.HUD.Headers=En-têtes

CoDHUD.HUD.Headers.Enable=Activer les notifications d'en-tête
CoDHUD.HUD.Headers.Enable.desc=Active les notifications d'en-tête, comme lors de l'accomplissement de défis ou du passage de niveau.

# Subtitles
CoDHUD.HUD.Subtitles=Sous-titres

CoDHUD.HUD.Subtitles.Enable=Activer les sous-titres
CoDHUD.HUD.Subtitles.Enable.desc=Active les sous-titres lorsqu'une réplique de l'annonceur est jouée.\n\n<color=255,100,100>Avertissement</color> : Les sous-titres sont créés à partir des répliques vocales en anglais.\n\n<color=255,255,100>Remarque</color> : Les sous-titres traduits ne sont pas disponibles.

CoDHUD.HUD.Subtitles.Callsign=Activer l'indicatif
CoDHUD.HUD.Subtitles.Callsign.desc=Active l'indicatif de l'annonceur en cours de lecture.

CoDHUD.HUD.Subtitles.NameAlign=Alignement de l'indicatif
CoDHUD.HUD.Subtitles.NameAlign.desc=Choisissez où placer l'indicatif de l'annonceur.

CoDHUD.HUD.Subtitles.NameAlign.Left=À gauche du texte
CoDHUD.HUD.Subtitles.NameAlign.Top=Au-dessus du texte

