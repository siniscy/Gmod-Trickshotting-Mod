CoDHUD.Faction.Select=Sélection de faction
CoDHUD.Faction.Select.desc=Choisissez la faction que vous représentez.\nAffecte votre statut ami/ennemi et modifie le narrateur ainsi que le thème en fonction de la faction.

CoDHUD.Faction.ChangeWarning=Attention !\nChanger d'équipe entraîne les conséquences suivantes :\n- Votre score sera remis à 0.\n- Vous serez tué et réapparaîtrez.\n\nÊtes-vous sûr de vouloir changer de faction ?

