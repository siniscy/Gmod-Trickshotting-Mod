CoDHUD.Faction.Select=Fraktionsauswahl
CoDHUD.Faction.Select.desc=Wähle, welche Fraktion du repräsentieren möchtest.\nBeeinflusst deinen Freund-oder-Feind-Status und ändert Ansager sowie Theme passend zur Fraktion.

CoDHUD.Faction.ChangeWarning=Warnung!\nDas Wechseln des Teams hat folgende Konsequenzen:\n- Dein Punktestand wird auf 0 zurückgesetzt.\n- Du wirst getötet und respawnst.\n\nBist du sicher, dass du die Fraktion wechseln möchtest?

