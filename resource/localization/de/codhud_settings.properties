CoDHUD.Type.bo2=Black Ops II
CoDHUD.Type.ghosts=Ghosts
CoDHUD.Type.aw=Advanced Warfare
CoDHUD.Type.bo3=Black Ops III
CoDHUD.Type.iw=Infinite Warfare
CoDHUD.Type.ww2=WWII

CoDHUD.Admin.RestrictFactionChance=Fraktionswechsel einschränken
CoDHUD.Admin.RestrictFactionChance.desc=Lege fest, wann Spieler ihre Fraktion wechseln dürfen.

CoDHUD.Admin.RestrictFactionChance.disable=Kann nicht wechseln
CoDHUD.Admin.RestrictFactionChance.freely=Kann frei wechseln
CoDHUD.Admin.RestrictFactionChance.pool=Nur aus aktivem Pool

