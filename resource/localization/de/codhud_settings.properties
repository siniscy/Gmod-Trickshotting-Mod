CoDHUD.Rank.Reset.Warning=Warnung!\nDu bist dabei, deinen Rang und deine Statistiken für dieses HUD zurückzusetzen!\nDies kann nicht rückgängig gemacht werden! Bist du sicher, dass du Rang und Statistiken zurücksetzen möchtest?

CoDHUD.Menu=Menü-Einstellungen
CoDHUD.Menu.Fullscreen=Im Vollbild öffnen
CoDHUD.Menu.Fullscreen.desc=Öffnet das CoD-HUD-Menü im Vollbild statt in einem kleineren Fenster.

CoDHUD.Menu.SFX=Menü-SFX
CoDHUD.Menu.SFX.desc=Spielt thematische Menü-Soundeffekte beim Überfahren oder Drücken von Buttons ab.

CoDHUD.Menu.Music=Menümusik
CoDHUD.Menu.Music.desc=Spielt thematische Menümusik ab, wenn irgendeine CoD-HUD-Menüinstanz aktiv ist.

CoDHUD.Menu.HideDesc=Beschreibung ausblenden
CoDHUD.Menu.HideDesc.desc=Falls aktiviert, werden Menübeschreibungen ausgeblendet.

CoDHUD.Menu.HidePrompts=Hinweise ausblenden
CoDHUD.Menu.HidePrompts.desc=Falls aktiviert, werden die Button-Hinweise im Menü ausgeblendet.

CoDHUD.Menu.OpenSpeed=Öffnungsgeschwindigkeit des Menüs
CoDHUD.Menu.OpenSpeed.desc=Wie schnell das CoD-HUD-Menü neue Instanzen öffnet.\n\nGemessen in Sekunden.

CoDHUD.Menu.CloseSpeed=Schließgeschwindigkeit des Menüs
CoDHUD.Menu.CloseSpeed.desc=Wie schnell das CoD-HUD-Menü Instanzen schließt.\n\nGemessen in Sekunden.

