# ---------[ ROUND START ]---------
CoDHUD.RoundStart=Rundensteuerung

CoDHUD.RoundStart.Gamemode=Spielmodus
CoDHUD.RoundStart.Info=Wähle den zu spielenden Spielmodus.

CoDHUD.RoundStart.Start=Runde starten
CoDHUD.RoundStart.Start.desc=Sobald ein Spielmodus ausgewählt wurde und die Einstellungen deinen Wünschen entsprechen, kannst du den Rundenstart beginnen.

CoDHUD.RoundStart.Notice=Bist du sicher, dass du eine neue Runde starten möchtest?\nAlle Punktestände werden zurückgesetzt und alle Spieler respawnen.
CoDHUD.RoundStart.Yes=Runde starten

CoDHUD.RoundStart.Timer=Rundenstart-Timer
CoDHUD.RoundStart.Timer.desc=Wie viele Sekunden Unterbrechung soll es vor Beginn der Runde geben.

CoDHUD.RoundStart.Autobalance=Fraktionen beim Rundenstart zufällig verteilen
CoDHUD.RoundStart.Autobalance.desc=Falls aktiviert, werden alle Spieler beim Start der Runde zufällig einer gültigen Fraktion zugewiesen.

CoDHUD.Scorelimit=Punktelimit
CoDHUD.Scorelimit.desc=Legt das maximale Punktelimit auf der Punkteanzeige fest.\n\nGemessen in Kills.

CoDHUD.Timelimit=Zeitlimit
CoDHUD.Timelimit.desc=Legt das Zeitlimit fest, bevor die Runde automatisch endet.\n\nGemessen in Minuten.\n\nAuf 0 setzen für unbegrenzt.

CoDHUD.Autobalance.Amount=Auto-Balance-Teamlimit
CoDHUD.Autobalance.Amount.desc=Legt die maximale Anzahl an Fraktionen fest, zu denen Spieler automatisch ausgeglichen werden können.

CoDHUD.Autobalance.Amount.disable=Deaktiviert
CoDHUD.Autobalance.Amount.2=2 Teams
CoDHUD.Autobalance.Amount.3=3 Teams
CoDHUD.Autobalance.Amount.4=4 Teams

CoDHUD.RoundStart.Auto=Runde beim Serverstart automatisch beginnen
CoDHUD.RoundStart.Auto.desc=Falls aktiviert, beginnt sofort eine neue Runde, sobald der erste Spieler dem Server beitritt.

CoDHUD.Admin.ResetTime=Runden-Timer zurücksetzen
CoDHUD.Admin.ResetTime.desc=Setzt den aktuellen Runden-Timer unabhängig vom aktuellen Wert auf den Wert des Zeitlimits zurück.

CoDHUD.ForceEndRound=Runde zwangsweise beenden
CoDHUD.ForceEndRound.desc=Klicke hier, wenn du die Runde vor Erreichen des Punkte- oder Zeitlimits beenden musst oder möchtest.

CoDHUD.ForceEndRound.Notice=Bist du sicher, dass du die Runde zwangsweise beenden möchtest?

# ---------[ ROUND END ]---------
CoDHUD.Admin.EndScreen="Spiel beendet" aktivieren
CoDHUD.Admin.EndScreen.desc=Aktiviert ein „Spiel beendet“-System, sobald das Punktelimit erreicht wird.

CoDHUD.Admin.EndScreen.StartNext=Nächste Runde nach Spielende starten
CoDHUD.Admin.EndScreen.StartNext.desc=Falls aktiviert, beginnt nach Ablauf der Spielende-Dauer automatisch eine neue Runde.\n\nFalls deaktiviert, respawnen alle Spieler normal.

CoDHUD.Admin.FriendlyFire=Eigenbeschuss erlauben
CoDHUD.Admin.FriendlyFire.desc=Falls aktiviert, können Spieler derselben Fraktion einander Schaden zufügen.\n\nGilt nur im Team-Deathmatch.

# ---------[ FACTION & HUD TYPE RESTRICTION ]---------
CoDHUD.Admin.RestrictType=Fraktionen & HUD-Typ einschränken
CoDHUD.Admin.RestrictType.Choose=Spiel auswählen
CoDHUD.Admin.RestrictType.desc=Wähle, auf welchen CoD-Titel Benutzer beschränkt werden sollen. Dies beeinflusst das HUD und die verfügbaren Fraktionen.

CoDHUD.Admin.RestrictType.Warning=Warnung!\nDas Wechseln des Spiels hat folgende Konsequenzen:\n- Die Fraktionen aller Spieler werden zufällig ausgewählt.\n- Alle Spielerpunkte werden auf 0 zurückgesetzt.\n- Alle Spieler werden getötet und respawnen.\n\nBist du sicher, dass du das Spiel wechseln möchtest?

CoDHUD.Type.cod4=Modern Warfare 1
CoDHUD.Type.waw=World at War
CoDHUD.Type.mw2=Modern Warfare 2
CoDHUD.Type.bo1=Black Ops
