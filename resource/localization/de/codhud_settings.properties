# ---------[ HUD-RELATED ]---------
CoDHUD.HUD=HUD-Einstellungen

# Multiple
CoDHUD.HUD.Outline=Umrandeter Text
CoDHUD.HUD.Outline.desc=Aktiviert umrandete Texte auf einigen Elementen, damit sie in sehr hellen Bereichen besser lesbar sind.

CoDHUD.HUD.Sound=SFX abspielen
CoDHUD.HUD.Sound.desc=Spielt zugehörige Soundeffekte ab, sofern der HUD-Typ dies unterstützt.

CoDHUD.HUD.Time.Total=Aktive Zeit
CoDHUD.HUD.Time.Total.desc=Wie lange die Variable nach vollständigem Einblenden sichtbar bleibt, bevor sie wieder ausgeblendet wird.

CoDHUD.HUD.Time.Fadein=Einblendzeit
CoDHUD.HUD.Time.Fadein.desc=Wie lange das Einblenden dieser Variable dauert.

CoDHUD.HUD.Time.Fadeout=Ausblendzeit
CoDHUD.HUD.Time.Fadeout.desc=Wie lange das Ausblenden dieser Variable dauert.

# Scale
CoDHUD.HUD.Scale=UI-Skalierung

CoDHUD.HUD.Scale.Enable=UI-Skalierungs-Multiplikator
CoDHUD.HUD.Scale.Enable.desc=Passt die Skalierung der vom CoD HUD verwendeten UI-Elemente an.\n\nNützlich für niedrige oder Ultrawide-Auflösungen.\n\n<color=255,255,100>Hinweis</color>: Das Menü wird nach dem Anwenden neu geladen.\n\n<color=255,100,100>WARNUNG</color>: Einige Elemente könnten stark falsch ausgerichtet werden, wenn der Wert unnötig zu hoch oder zu niedrig eingestellt wird.

# Scoreboard
CoDHUD.HUD.Scoreboard=Punktetafel

CoDHUD.HUD.Scoreboard.Enable=Punktetafel aktivieren
CoDHUD.HUD.Scoreboard.Enable.desc=Aktiviert die Punktetafel. Zeigt die aktuell von allen Spielern belegten Fraktionen an.

# Score Counter
CoDHUD.HUD.Scorecounter=Punkteanzeige

CoDHUD.HUD.Scorecounter.Enable=Punkteanzeige aktivieren
CoDHUD.HUD.Scorecounter.Enable.desc=Aktiviert einen Server-Timer, ein Fraktionssymbol und Punktestände.\n\nEinige HUD-Typen zeigen das Fraktionssymbol nicht an.

# Medals
CoDHUD.HUD.Medals=Medaillen

CoDHUD.HUD.Medals.Enable=Medaillen aktivieren
CoDHUD.HUD.Medals.Enable.desc=Aktiviert Medaillen, die durch bestimmte Aktionen wie schnelle Kills oder Kopfschüsse verdient werden.\n\nBeachte, dass einige HUD-Typen nur Text anzeigen, während andere Text und Symbole besitzen.

CoDHUD.HUD.Medals.Speedup=Schneller bei langer Warteschlange
CoDHUD.HUD.Medals.Speedup.desc=Beschleunigt die Medaillen-Warteschlange, wenn viele Medaillen gleichzeitig anstehen.\n\nJe nach HUD-Typ werden außerdem die zugehörigen SFX deaktiviert, wenn mehr als 3 Medaillen in der Warteschlange sind.

# Kill Feed
CoDHUD.HUD.Killfeed=Killfeed

CoDHUD.HUD.Killfeed.Enable=Killfeed aktivieren
CoDHUD.HUD.Killfeed.Enable.desc=Aktiviert den Killfeed.

# Minimap
CoDHUD.HUD.Minimap=Minikarte

CoDHUD.HUD.Minimap.Enable=Minikarte aktivieren
CoDHUD.HUD.Minimap.Enable.desc=Aktiviert die Minikarte.

# Hitmarker
CoDHUD.HUD.Hitmarker=Treffermarkierung

CoDHUD.HUD.Hitmarker.Enable=Treffermarkierung aktivieren
CoDHUD.HUD.Hitmarker.Enable.desc=Aktiviert die Treffermarkierung und den zugehörigen Treffer-Sound.

# Weapon Info
CoDHUD.HUD.WeaponInfo=Waffeninformationen

CoDHUD.HUD.WeaponInfo.Enable=Waffeninformationen aktivieren
CoDHUD.HUD.WeaponInfo.Enable.desc=Aktiviert die Waffeninformationsanzeige mit Waffenname und Munitionszähler.\n\nEinige HUD-Typen integrieren hier zusätzlich den Kompass.

CoDHUD.HUD.WeaponPrompts.Enable=Waffenhinweise aktivieren
CoDHUD.HUD.WeaponPrompts.Enable.desc=Aktiviert Waffenhinweise wie Benachrichtigungen über niedrige Munition.

# XP Counter
CoDHUD.HUD.XP=XP-Anzeige

CoDHUD.HUD.XP.Enable=XP-Anzeige aktivieren
CoDHUD.HUD.XP.Enable.desc=Aktiviert XP-Benachrichtigungen.

# Target ID / IFF
CoDHUD.HUD.IFF=Freund oder Feind identifizieren

CoDHUD.HUD.IFF.Enable=IFF aktivieren
CoDHUD.HUD.IFF.Enable.desc=Aktiviert ein „Freund oder Feind identifizieren“-System, das den Namen des Ziels über dessen Kopf anzeigt, wenn du in seine Nähe zielst.

# Death Icon
CoDHUD.HUD.DeathIcon=Todesicon

CoDHUD.HUD.DeathIcon.Enable=Todesicon aktivieren
CoDHUD.HUD.DeathIcon.Enable.desc=Aktiviert das Todesicon, das angezeigt wird, wenn ein Spieler derselben Fraktion stirbt.

# Chat
CoDHUD.HUD.Chat=Chat

CoDHUD.HUD.Chat.Enable=Chat aktivieren
CoDHUD.HUD.Chat.Enable.desc=Aktiviert den Chat.

# Headers
CoDHUD.HUD.Headers=Überschriften

CoDHUD.HUD.Headers.Enable=Header-Benachrichtigungen aktivieren
CoDHUD.HUD.Headers.Enable.desc=Aktiviert Header-Benachrichtigungen, beispielsweise beim Abschließen von Herausforderungen oder beim Levelaufstieg.

# Subtitles
CoDHUD.HUD.Subtitles=Untertitel

CoDHUD.HUD.Subtitles.Enable=Untertitel aktivieren
CoDHUD.HUD.Subtitles.Enable.desc=Aktiviert Untertitel, wenn eine Sprecher-Voice-Line abgespielt wird.\n\n<color=255,100,100>Warnung</color>: Untertitel werden für die englischen Sprachzeilen erstellt.\n\n<color=255,255,100>Hinweis</color>: Übersetzte Untertitel sind nicht verfügbar.

CoDHUD.HUD.Subtitles.Callsign=Rufzeichen aktivieren
CoDHUD.HUD.Subtitles.Callsign.desc=Aktiviert das Rufzeichen des aktuell abgespielten Sprechers.

CoDHUD.HUD.Subtitles.NameAlign=Rufzeichen-Ausrichtung
CoDHUD.HUD.Subtitles.NameAlign.desc=Wählen Sie, wo das Rufzeichen des Sprechers angezeigt werden soll.

CoDHUD.HUD.Subtitles.NameAlign.Left=Links neben dem Text
CoDHUD.HUD.Subtitles.NameAlign.Top=Über dem Text

