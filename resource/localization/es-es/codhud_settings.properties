# ---------[ ROUND START ]---------
CoDHUD.RoundStart=Controles de ronda

CoDHUD.RoundStart.Gamemode=Modo de juego
CoDHUD.RoundStart.Info=Elige el modo de juego.

CoDHUD.RoundStart.Start=Iniciar ronda
CoDHUD.RoundStart.Start.desc=Una vez seleccionado el modo de juego y configuradas las opciones a tu gusto, puedes iniciar el proceso de comienzo de ronda.

CoDHUD.RoundStart.Notice=¿Seguro que quieres iniciar una nueva ronda?\nTodas las puntuaciones se reiniciarán y todos los jugadores reaparecerán.
CoDHUD.RoundStart.Yes=Iniciar ronda

CoDHUD.RoundStart.Timer=Temporizador de inicio de ronda
CoDHUD.RoundStart.Timer.desc=Cuántos segundos de intermedio debe haber antes de que comience la ronda.

CoDHUD.RoundStart.Autobalance=Aleatorizar facciones al comenzar la ronda
CoDHUD.RoundStart.Autobalance.desc=Si está activado, todos los jugadores serán colocados aleatoriamente en una facción válida cuando comience la ronda.

CoDHUD.Scorelimit=Límite de puntuación
CoDHUD.Scorelimit.desc=Establece el límite máximo de puntuación mostrado en el contador.\n\nMedido en bajas.

CoDHUD.Timelimit=Límite de tiempo
CoDHUD.Timelimit.desc=Establece el límite de tiempo antes de que la ronda termine automáticamente.\n\nMedido en minutos.\n\nEstablece 0 para ilimitado.

CoDHUD.Autobalance.Amount=Límite de equipos para autoequilibrio
CoDHUD.Autobalance.Amount.desc=Establece la cantidad máxima de facciones a las que los jugadores pueden ser autoequilibrados.

CoDHUD.Autobalance.Amount.disable=Desactivado
CoDHUD.Autobalance.Amount.2=2 Equipos
CoDHUD.Autobalance.Amount.3=3 Equipos
CoDHUD.Autobalance.Amount.4=4 Equipos

CoDHUD.RoundStart.Auto=Iniciar ronda automáticamente al arrancar el servidor
CoDHUD.RoundStart.Auto.desc=Si está activado, una nueva ronda comenzará inmediatamente cuando el primer jugador se una al servidor.

CoDHUD.Admin.ResetTime=Restablecer temporizador de ronda
CoDHUD.Admin.ResetTime.desc=Restablece el temporizador actual de la ronda desde su valor actual al valor configurado en el límite de tiempo.

CoDHUD.ForceEndRound=Forzar finalización de la ronda
CoDHUD.ForceEndRound.desc=Haz clic aquí si necesitas o quieres terminar la ronda antes de alcanzar el límite de puntuación o tiempo.

CoDHUD.ForceEndRound.Notice=¿Seguro que quieres terminar la ronda a la fuerza?

# ---------[ ROUND END ]---------
CoDHUD.Admin.EndScreen=Activar \"Fin de partida\"
CoDHUD.Admin.EndScreen.desc=Activa un sistema de \"fin de partida\" cuando se alcance el límite de puntuación.

CoDHUD.Admin.EndScreen.StartNext=Iniciar siguiente ronda después del fin de partida
CoDHUD.Admin.EndScreen.StartNext.desc=Si está activado, una vez finalizada la duración del fin de partida, comenzará una nueva ronda.\n\nSi está desactivado, todos los jugadores reaparecerán normalmente.

CoDHUD.Admin.FriendlyFire=Permitir fuego amigo
CoDHUD.Admin.FriendlyFire.desc=Si está activado, los jugadores de la misma facción podrán dañarse entre sí.\n\nSolo se aplica en Duelo por equipos.

# ---------[ FACTION & HUD TYPE RESTRICTION ]---------
CoDHUD.Admin.RestrictType=Restringir facciones y tipo de HUD
CoDHUD.Admin.RestrictType.Choose=Elegir juego
CoDHUD.Admin.RestrictType.desc=Elige a qué título de CoD restringir a los usuarios. Esto afecta al HUD y a las facciones disponibles.

CoDHUD.Admin.RestrictType.Warning=¡Advertencia!\nCambiar de juego tendrá las siguientes consecuencias:\n- Las facciones de todos los jugadores serán seleccionadas aleatoriamente.\n- Todas las puntuaciones de los jugadores se reiniciarán a 0.\n- Todos los jugadores morirán y reaparecerán.\n\n¿Seguro que quieres cambiar de juego?

CoDHUD.Type.cod4=Modern Warfare 1
CoDHUD.Type.waw=World at War
CoDHUD.Type.mw2=Modern Warfare 2
CoDHUD.Type.bo1=Black Ops
CoDHUD.Type.mw3=Modern Warfare 3
CoDHUD.Type.bo2=Black Ops II
CoDHUD.Type.ghosts=Ghosts
CoDHUD.Type.aw=Advanced Warfare
CoDHUD.Type.bo3=Black Ops III
CoDHUD.Type.iw=Infinite Warfare
CoDHUD.Type.ww2=WWII

CoDHUD.Admin.RestrictFactionChance=Restringir cambio de facciones
CoDHUD.Admin.RestrictFactionChance.desc=Elige cuándo los jugadores pueden cambiar de facción.

CoDHUD.Admin.RestrictFactionChance.disable=No puede cambiar
CoDHUD.Admin.RestrictFactionChance.freely=Puede cambiar libremente
CoDHUD.Admin.RestrictFactionChance.pool=Solo desde el grupo activo

