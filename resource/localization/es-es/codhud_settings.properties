CoDHUD.Audio.Announcer.Enable=Activar voz del locutor
CoDHUD.Audio.Announcer.Enable.desc=Activa el locutor.

CoDHUD.Audio.Announcer.English=Forzar locutor en inglés
CoDHUD.Audio.Announcer.English.desc=Fuerza la reproducción de voces del locutor en inglés, independientemente del idioma del juego.

CoDHUD.Audio.Music.Enable=Activar música
CoDHUD.Audio.Music.Enable.desc=Activa la música.

CoDHUD.Audio.Music.Ambient=Activar música ambiental
CoDHUD.Audio.Music.Ambient.desc=Activa música ambiental de fondo.

CoDHUD.Reset=Restablecer ajustes
CoDHUD.Challenges.Reset=Restablecer desafíos
CoDHUD.Challenges.Reset.desc=Restablece todos los desafíos desbloqueados.

CoDHUD.Rank.Reset=Restablecer rango y estadísticas
CoDHUD.Rank.Reset.desc=Restablece el rango y todas las estadísticas del HUD actual.
CoDHUD.Rank.Reset.Warning=¡Advertencia!\n¡Estás a punto de restablecer tu rango y estadísticas en este HUD!\n¡Esto no se puede deshacer! ¿Seguro que quieres restablecer tu rango y estadísticas?

CoDHUD.Menu=Ajustes del menú
CoDHUD.Menu.Fullscreen=Abrir en pantalla completa
CoDHUD.Menu.Fullscreen.desc=Abre el menú del HUD de CoD en pantalla completa en lugar de una ventana pequeña.

CoDHUD.Menu.SFX=SFX del menú
CoDHUD.Menu.SFX.desc=Reproduce efectos de sonido temáticos del menú al pasar el cursor o pulsar botones.

CoDHUD.Menu.Music=Música del menú
CoDHUD.Menu.Music.desc=Reproduce música temática del menú cuando cualquier instancia del menú HUD de CoD está activa.

CoDHUD.Menu.HideDesc=Ocultar descripción
CoDHUD.Menu.HideDesc.desc=Si está activado, las descripciones del menú estarán ocultas.

CoDHUD.Menu.HidePrompts=Ocultar avisos
CoDHUD.Menu.HidePrompts.desc=Si está activado, los avisos de botones en el menú estarán ocultos.

CoDHUD.Menu.OpenSpeed=Velocidad de apertura del menú
CoDHUD.Menu.OpenSpeed.desc=Qué tan rápido el menú HUD de CoD abrirá nuevas instancias.\n\nMedido en segundos.

CoDHUD.Menu.CloseSpeed=Velocidad de cierre del menú
CoDHUD.Menu.CloseSpeed.desc=Qué tan rápido el menú HUD de CoD cerrará instancias.\n\nMedido en segundos.

