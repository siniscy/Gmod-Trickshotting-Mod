# ---------[ FACTION-RELATED ]---------
CoDHUD.Faction.Select=Selección de facción
CoDHUD.Faction.Select.desc=Elige qué facción representar.\nAfecta a tu estado de amigo o enemigo y cambia el narrador y el tema para coincidir con la facción.

CoDHUD.Faction.ChangeWarning=¡Advertencia!\nCambiar de equipo tendrá las siguientes consecuencias:\n- Tu puntuación se reiniciará a 0.\n- Morirás y reaparecerás.\n\n¿Seguro que quieres cambiar de facción?

# ---------[ QUICK-ACCESS ]---------
CoDHUD.Quick.title=Acceso rápido

CoDHUD.Quick.DisableHUD=Desactivar rápidamente todas las opciones del HUD
CoDHUD.Quick.DisableHUD.desc=Desactiva todas las opciones del HUD de CoD.

# ---------[ HUD-RELATED ]---------
CoDHUD.HUD=Ajustes del HUD

# Multiple
CoDHUD.HUD.Outline=Texto con contorno
CoDHUD.HUD.Outline.desc=Activa texto con contorno en algunos elementos para hacerlos más fáciles de leer en áreas muy brillantes.

CoDHUD.HUD.Sound=Reproducir SFX
CoDHUD.HUD.Sound.desc=Reproduce efectos de sonido asociados si el tipo de HUD los soporta.

CoDHUD.HUD.Time.Total=Tiempo activo
CoDHUD.HUD.Time.Total.desc=Cuánto tiempo permanece visible la variable después de aparecer completamente antes de desvanecerse.

CoDHUD.HUD.Time.Fadein=Tiempo de aparición
CoDHUD.HUD.Time.Fadein.desc=Cuánto tarda esta variable en aparecer.

CoDHUD.HUD.Time.Fadeout=Tiempo de desvanecimiento
CoDHUD.HUD.Time.Fadeout.desc=Cuánto tarda esta variable en desaparecer.

# Scale
CoDHUD.HUD.Scale=Escala de UI

CoDHUD.HUD.Scale.Enable=Multiplicador de escala de UI
CoDHUD.HUD.Scale.Enable.desc=Ajusta la escala de los elementos de UI utilizados por el HUD de CoD.\n\nÚtil para resoluciones bajas o ultrapanorámicas.\n\n<color=255,255,100>Nota</color>: Recargará el menú al aplicarse.\n\n<color=255,100,100>ADVERTENCIA</color>: Algunos elementos podrían quedar gravemente desalineados si el valor se establece demasiado alto o demasiado bajo innecesariamente.

# Scoreboard
CoDHUD.HUD.Scoreboard=Marcador

CoDHUD.HUD.Scoreboard.Enable=Activar marcador
CoDHUD.HUD.Scoreboard.Enable.desc=Activa el marcador. Muestra las facciones ocupadas actualmente por todos los jugadores.

# Score Counter
CoDHUD.HUD.Scorecounter=Contador de puntuación

CoDHUD.HUD.Scorecounter.Enable=Activar contador de puntuación
CoDHUD.HUD.Scorecounter.Enable.desc=Activa un temporizador del servidor, el icono de facción y los contadores de puntuación.\n\nAlgunos tipos de HUD no mostrarán el icono de facción.

# Medals
CoDHUD.HUD.Medals=Medallas

CoDHUD.HUD.Medals.Enable=Activar medallas
CoDHUD.HUD.Medals.Enable.desc=Activa las medallas, obtenidas al realizar ciertas acciones como bajas rápidas o disparos a la cabeza.\n\nTen en cuenta que algunos tipos de HUD solo tienen texto, mientras que otros tienen texto e iconos.

CoDHUD.HUD.Medals.Speedup=Más rápido si la cola es larga
CoDHUD.HUD.Medals.Speedup.desc=Acelera la cola de medallas si hay muchas acumuladas al mismo tiempo.\n\nDependiendo del tipo de HUD, también desactiva los SFX asociados si hay más de 3 medallas en cola.

# Kill Feed
CoDHUD.HUD.Killfeed=Registro de bajas

CoDHUD.HUD.Killfeed.Enable=Activar registro de bajas
CoDHUD.HUD.Killfeed.Enable.desc=Activa el registro de bajas.

# Minimap
CoDHUD.HUD.Minimap=Minimapa

CoDHUD.HUD.Minimap.Enable=Activar minimapa
CoDHUD.HUD.Minimap.Enable.desc=Activa el minimapa.

# Hitmarker
CoDHUD.HUD.Hitmarker=Marcador de impacto

CoDHUD.HUD.Hitmarker.Enable=Activar marcador de impacto
CoDHUD.HUD.Hitmarker.Enable.desc=Activa el marcador de impacto y su sonido asociado.

# Weapon Info
CoDHUD.HUD.WeaponInfo=Información de arma

CoDHUD.HUD.WeaponInfo.Enable=Activar información de arma
CoDHUD.HUD.WeaponInfo.Enable.desc=Activa la pestaña de información del arma, mostrando el nombre del arma y el contador de munición.\n\nAlgunos tipos de HUD también incorporan aquí la brújula.

CoDHUD.HUD.WeaponPrompts.Enable=Activar avisos de armas
CoDHUD.HUD.WeaponPrompts.Enable.desc=Activa avisos de armas, como notificaciones de poca munición.

# XP Counter
CoDHUD.HUD.XP=Aviso de XP

CoDHUD.HUD.XP.Enable=Activar aviso de XP
CoDHUD.HUD.XP.Enable.desc=Activa los avisos de XP.

# Target ID / IFF
CoDHUD.HUD.IFF=Identificar amigo o enemigo

CoDHUD.HUD.IFF.Enable=Activar IFF
CoDHUD.HUD.IFF.Enable.desc=Activa un sistema de \"Identificar amigo o enemigo\", mostrando el nombre del objetivo sobre su cabeza al apuntar cerca de él.

# Death Icon
CoDHUD.HUD.DeathIcon=Icono de muerte

CoDHUD.HUD.DeathIcon.Enable=Activar icono de muerte
CoDHUD.HUD.DeathIcon.Enable.desc=Activa el icono de muerte, mostrado donde muere cualquier jugador de la misma facción.

# Chat
CoDHUD.HUD.Chat=Chat

CoDHUD.HUD.Chat.Enable=Activar chat
CoDHUD.HUD.Chat.Enable.desc=Activa el chat.

# Headers
CoDHUD.HUD.Headers=Encabezados

CoDHUD.HUD.Headers.Enable=Activar avisos de encabezado
CoDHUD.HUD.Headers.Enable.desc=Activa avisos de encabezado, como al completar desafíos o subir de nivel.

# Subtitles
CoDHUD.HUD.Subtitles=Subtítulos

CoDHUD.HUD.Subtitles.Enable=Activar subtítulos
CoDHUD.HUD.Subtitles.Enable.desc=Activa los subtítulos cuando se reproduce una línea de voz del narrador.\n\n<color=255,100,100>Advertencia</color>: Los subtítulos se generan a partir de las líneas de voz en inglés.\n\n<color=255,255,100>Nota</color>: No hay subtítulos traducidos disponibles.

CoDHUD.HUD.Subtitles.Callsign=Activar indicativo
CoDHUD.HUD.Subtitles.Callsign.desc=Activa el indicativo del narrador que se reproduce.

CoDHUD.HUD.Subtitles.NameAlign=Alineación del indicativo
CoDHUD.HUD.Subtitles.NameAlign.desc=Elige dónde debe ubicarse el indicativo del narrador.

CoDHUD.HUD.Subtitles.NameAlign.Left=A la izquierda del texto
CoDHUD.HUD.Subtitles.NameAlign.Top=Encima del texto

