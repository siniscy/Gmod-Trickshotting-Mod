# ---------[ ROUND START ]---------
CoDHUD.RoundStart=ラウンド管理

CoDHUD.RoundStart.Gamemode=ゲームモード
CoDHUD.RoundStart.Info=プレイするゲームモードを選択してください。

CoDHUD.RoundStart.Start=ラウンド開始
CoDHUD.RoundStart.Start.desc=ゲームモードを選択し、設定を調整した後、ラウンド開始プロセスを実行できます。

CoDHUD.RoundStart.Notice=新しいラウンドを開始しますか？\nすべてのスコアはリセットされ、全プレイヤーがリスポーンします。
CoDHUD.RoundStart.Yes=ラウンド開始

CoDHUD.RoundStart.Timer=ラウンド開始タイマー
CoDHUD.RoundStart.Timer.desc=ラウンド開始前の待機時間（秒）。

CoDHUD.RoundStart.Autobalance=ラウンド開始時にチームをランダム化
CoDHUD.RoundStart.Autobalance.desc=有効にすると、ラウンド開始時に全プレイヤーが有効な陣営へランダムに振り分けられます。

CoDHUD.Scorelimit=スコア上限
CoDHUD.Scorelimit.desc=スコアカウンターの最大値を設定します。\n\nキル数で計測されます。

CoDHUD.Timelimit=時間制限
CoDHUD.Timelimit.desc=ラウンドが自動終了するまでの時間制限。\n\n分単位で計測されます。\n\n0で無制限。

CoDHUD.Autobalance.Amount=自動チーム割り当て上限
CoDHUD.Autobalance.Amount.desc=プレイヤーが自動的に割り当てられる陣営の最大数を設定します。

CoDHUD.Autobalance.Amount.disable=無効
CoDHUD.Autobalance.Amount.2=2チーム
CoDHUD.Autobalance.Amount.3=3チーム
CoDHUD.Autobalance.Amount.4=4チーム

CoDHUD.RoundStart.Auto=サーバー開始時に自動でラウンド開始
CoDHUD.RoundStart.Auto.desc=有効にすると、最初のプレイヤーが参加した時点で即座に新しいラウンドが開始されます。

CoDHUD.Admin.ResetTime=ラウンドタイマーをリセット
CoDHUD.Admin.ResetTime.desc=現在のラウンドタイマーを時間制限の値にリセットします。

CoDHUD.ForceEndRound=ラウンド強制終了
CoDHUD.ForceEndRound.desc=スコアまたは時間制限に達する前にラウンドを終了したい場合に使用します。

CoDHUD.ForceEndRound.Notice=本当にラウンドを強制終了しますか？

# ---------[ ROUND END ]---------
CoDHUD.Admin.EndScreen=「試合終了」を有効化
CoDHUD.Admin.EndScreen.desc=スコア上限に達した際に試合終了システムを有効化します。

CoDHUD.Admin.EndScreen.StartNext=試合終了後に次のラウンドを開始
CoDHUD.Admin.EndScreen.StartNext.desc=有効にすると、試合終了後に新しいラウンドが開始されます。\n\n無効の場合は全プレイヤーが通常リスポーンします。

CoDHUD.Admin.FriendlyFire=フレンドリーファイア許可
CoDHUD.Admin.FriendlyFire.desc=有効にすると、同じ陣営のプレイヤー同士でもダメージを与えられます。\n\nチームデスマッチのみ適用されます。

