CoDHUD.Admin.RestrictType.Warning=警告！\nゲームを変更すると以下の影響があります：\n- 全プレイヤーの陣営がランダムに割り当てられます。\n- 全プレイヤーのスコアが0にリセットされます。\n- 全プレイヤーが死亡しリスポーンします。\n\n本当にゲームを変更しますか？

