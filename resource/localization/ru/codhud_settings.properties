# ---------[ ROUND START ]---------
CoDHUD.RoundStart=Управление раундом

CoDHUD.RoundStart.Gamemode=Режим игры
CoDHUD.RoundStart.Info=Выберите режим игры.

CoDHUD.RoundStart.Start=Начать раунд
CoDHUD.RoundStart.Start.desc=После выбора режима игры и настройки параметров вы можете начать процесс запуска раунда.

CoDHUD.RoundStart.Notice=Вы уверены, что хотите начать новый раунд?\nВсе очки будут сброшены, и все игроки возродятся.
CoDHUD.RoundStart.Yes=Начать раунд

CoDHUD.RoundStart.Timer=Таймер начала раунда
CoDHUD.RoundStart.Timer.desc=Сколько секунд должно быть перед началом раунда.

CoDHUD.RoundStart.Autobalance=Случайное распределение фракций при старте раунда
CoDHUD.RoundStart.Autobalance.desc=Если включено, все игроки будут случайно распределены по доступным фракциям при начале раунда.

CoDHUD.Scorelimit=Лимит очков
CoDHUD.Scorelimit.desc=Устанавливает максимальный лимит очков для счётчика.\n\nИзмеряется в убийствах.

CoDHUD.Timelimit=Лимит времени
CoDHUD.Timelimit.desc=Устанавливает лимит времени до автоматического завершения раунда.\n\nИзмеряется в минутах.\n\n0 = без лимита.

CoDHUD.Autobalance.Amount=Лимит авто-баланса команд
CoDHUD.Autobalance.Amount.desc=Устанавливает максимальное количество фракций для авто-распределения игроков.

CoDHUD.Autobalance.Amount.disable=Отключено
CoDHUD.Autobalance.Amount.2=2 команды
CoDHUD.Autobalance.Amount.3=3 команды
CoDHUD.Autobalance.Amount.4=4 команды

CoDHUD.RoundStart.Auto=Автоматически начинать раунд при запуске сервера
CoDHUD.RoundStart.Auto.desc=Если включено, новый раунд начнётся сразу после подключения первого игрока.

CoDHUD.Admin.ResetTime=Сброс таймера раунда
CoDHUD.Admin.ResetTime.desc=Сбрасывает текущий таймер раунда к значению лимита времени.

CoDHUD.ForceEndRound=Принудительно завершить раунд
CoDHUD.ForceEndRound.desc=Используйте, если нужно завершить раунд до достижения лимита очков или времени.

CoDHUD.ForceEndRound.Notice=Вы уверены, что хотите принудительно завершить раунд?

# ---------[ ROUND END ]---------
CoDHUD.Admin.EndScreen=Включить "конец матча"
CoDHUD.Admin.EndScreen.desc=Включает систему окончания матча при достижении лимита очков.

CoDHUD.Admin.EndScreen.StartNext=Начать следующий раунд после матча
CoDHUD.Admin.EndScreen.StartNext.desc=Если включено, после окончания матча начнётся новый раунд.\n\nЕсли отключено, все игроки просто возрождаются.

CoDHUD.Admin.FriendlyFire=Огонь по своим
CoDHUD.Admin.FriendlyFire.desc=Если включено, игроки одной фракции могут наносить друг другу урон.\n\nТолько для Team Deathmatch.

