CoDHUD.Faction.Select.desc=Выберите фракцию для участия.\nВлияет на распознавание "свой/чужой" и тему интерфейса.

CoDHUD.Faction.ChangeWarning=Внимание!\nСмена команды приведёт к:\n- Сбросу вашего счёта до 0.\n- Вашей смерти и респавну.\n\nВы уверены, что хотите сменить фракцию?

