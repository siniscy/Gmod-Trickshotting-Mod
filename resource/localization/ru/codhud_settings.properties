CoDHUD.Admin.RestrictType.Warning=Внимание!\nИзменение игры приведёт к:\n- Случайному распределению фракций всех игроков.\n- Сбросу всех очков до 0.\n- Убийству и респавну всех игроков.\n\nВы уверены, что хотите изменить игру?

