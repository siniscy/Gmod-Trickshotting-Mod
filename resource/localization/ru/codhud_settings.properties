CoDHUD.Admin.RestrictFactionChance.desc=Определяет, когда игроки могут менять фракции.

CoDHUD.Admin.RestrictFactionChance.disable=Нельзя менять
CoDHUD.Admin.RestrictFactionChance.freely=Свободная смена
