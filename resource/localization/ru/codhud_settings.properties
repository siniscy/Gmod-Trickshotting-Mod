CoDHUD.HUD.Scale.Enable.desc=Настраивает масштаб элементов интерфейса CoD HUD.\n\nПолезно для низких или ультрашироких разрешений.\n\n<color=255,255,100>Примечание</color>: перезагружает меню.\n\n<color=255,100,100>ВНИМАНИЕ</color>: слишком большие или маленькие значения могут нарушить интерфейс.

# Scoreboard
CoDHUD.HUD.Scoreboard=Таблица результатов

