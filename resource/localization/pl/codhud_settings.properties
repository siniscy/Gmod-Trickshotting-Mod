CoDHUD.Admin.ResetTime=Reset timera rundy
CoDHUD.Admin.ResetTime.desc=Resetuje aktualny timer rundy do wartości limitu czasu.

CoDHUD.ForceEndRound=Wymuś zakończenie rundy
CoDHUD.ForceEndRound.desc=Użyj, jeśli chcesz zakończyć rundę przed osiągnięciem limitu czasu lub punktów.

