# ---------[ ROUND START ]---------
CoDHUD.RoundStart=Controlli round

CoDHUD.RoundStart.Gamemode=Modalità di gioco
CoDHUD.RoundStart.Info=Scegli la modalità di gioco.

CoDHUD.RoundStart.Start=Avvia round
CoDHUD.RoundStart.Start.desc=Una volta selezionata una modalità di gioco e configurate le impostazioni a tuo piacimento, puoi avviare il processo di inizio round.

CoDHUD.RoundStart.Notice=Sei sicuro di voler iniziare un nuovo round?\nTutti i punteggi verranno azzerati e tutti i giocatori rinasceranno.
CoDHUD.RoundStart.Yes=Avvia round

CoDHUD.RoundStart.Timer=Timer di inizio round
CoDHUD.RoundStart.Timer.desc=Quanti secondi di intermezzo devono esserci prima che inizi il round.

CoDHUD.RoundStart.Autobalance=Randomizza fazioni all'inizio del round
CoDHUD.RoundStart.Autobalance.desc=Se attivato, tutti i giocatori verranno assegnati casualmente a una fazione valida all'inizio del round.

CoDHUD.Scorelimit=Limite punteggio
CoDHUD.Scorelimit.desc=Imposta il limite massimo di punteggio mostrato nel contatore.\n\nMisurato in uccisioni.

CoDHUD.Timelimit=Limite di tempo
CoDHUD.Timelimit.desc=Imposta il limite di tempo prima della fine automatica del round.\n\nMisurato in minuti.\n\nImposta a 0 per illimitato.

CoDHUD.Autobalance.Amount=Limite auto-bilanciamento squadre
CoDHUD.Autobalance.Amount.desc=Imposta il numero massimo di fazioni a cui i giocatori possono essere auto-bilanciati.

CoDHUD.Autobalance.Amount.disable=Disattivato
CoDHUD.Autobalance.Amount.2=2 squadre
CoDHUD.Autobalance.Amount.3=3 squadre
CoDHUD.Autobalance.Amount.4=4 squadre

CoDHUD.RoundStart.Auto=Avvia automaticamente il round all'avvio del server
CoDHUD.RoundStart.Auto.desc=Se attivato, un nuovo round inizierà immediatamente quando il primo giocatore entra nel server.

CoDHUD.Admin.ResetTime=Reset timer del round
CoDHUD.Admin.ResetTime.desc=Reimposta il timer del round corrente al valore del limite di tempo impostato.

CoDHUD.ForceEndRound=Forza fine round
CoDHUD.ForceEndRound.desc=Clicca qui se devi o vuoi terminare il round prima del raggiungimento del limite di punteggio o tempo.

CoDHUD.ForceEndRound.Notice=Sei sicuro di voler terminare forzatamente il round?

# ---------[ ROUND END ]---------
CoDHUD.Admin.EndScreen=Abilita "Fine partita"
CoDHUD.Admin.EndScreen.desc=Abilita un sistema di "fine partita" quando viene raggiunto il limite di punteggio.

CoDHUD.Admin.EndScreen.StartNext=Avvia nuova partita dopo la fine match
CoDHUD.Admin.EndScreen.StartNext.desc=Se attivato, una volta terminata la durata del fine partita, inizierà un nuovo round.\n\nSe disattivato, tutti i giocatori respawneranno normalmente.

CoDHUD.Admin.FriendlyFire=Abilita fuoco amico
CoDHUD.Admin.FriendlyFire.desc=Se attivato, i giocatori della stessa fazione possono danneggiarsi tra loro.\n\nSi applica solo nel Team Deathmatch.

# ---------[ FACTION & HUD TYPE RESTRICTION ]---------
CoDHUD.Admin.RestrictType=Limita fazioni e tipo HUD
CoDHUD.Admin.RestrictType.Choose=Scegli gioco
CoDHUD.Admin.RestrictType.desc=Scegli a quale titolo CoD limitare gli utenti. Questo influisce sull'HUD e sulle fazioni disponibili.

CoDHUD.Admin.RestrictType.Warning=Attenzione!\nCambiare gioco avrà le seguenti conseguenze:\n- Tutte le fazioni dei giocatori verranno assegnate casualmente.\n- Tutti i punteggi dei giocatori verranno azzerati.\n- Tutti i giocatori verranno uccisi e rianimati.\n\nSei sicuro di voler cambiare gioco?

CoDHUD.Type.cod4=Modern Warfare 1
CoDHUD.Type.waw=World at War
CoDHUD.Type.mw2=Modern Warfare 2
CoDHUD.Type.bo1=Black Ops
CoDHUD.Type.mw3=Modern Warfare 3
CoDHUD.Type.bo2=Black Ops II
CoDHUD.Type.ghosts=Ghosts
CoDHUD.Type.aw=Advanced Warfare
CoDHUD.Type.bo3=Black Ops III
CoDHUD.Type.iw=Infinite Warfare
CoDHUD.Type.ww2=WWII

CoDHUD.Admin.RestrictFactionChance=Limita cambio fazione
CoDHUD.Admin.RestrictFactionChance.desc=Scegli quando i giocatori possono cambiare fazione.

CoDHUD.Admin.RestrictFactionChance.disable=Non può cambiare
CoDHUD.Admin.RestrictFactionChance.freely=Cambio libero
CoDHUD.Admin.RestrictFactionChance.pool=Solo dal gruppo attivo

