CoDHUD.Quick.DisableHUD=Disattivazione rapida di tutte le opzioni HUD
CoDHUD.Quick.DisableHUD.desc=Disattiva tutte le opzioni del CoD HUD.

# ---------[ HUD-RELATED ]---------
CoDHUD.HUD=Impostazioni HUD

# Multiple
CoDHUD.HUD.Outline=Testo contornato
CoDHUD.HUD.Outline.desc=Attiva il testo contornato su alcuni elementi per renderli più leggibili in aree molto luminose.

CoDHUD.HUD.Sound=Riproduci SFX
CoDHUD.HUD.Sound.desc=Riproduce effetti sonori associati se supportati dal tipo di HUD.

CoDHUD.HUD.Time.Total=Tempo attivo
CoDHUD.HUD.Time.Total.desc=Quanto a lungo la variabile rimane sullo schermo dopo essere completamente apparsa prima di scomparire.

CoDHUD.HUD.Time.Fadein=Tempo di comparsa
CoDHUD.HUD.Time.Fadein.desc=Quanto tempo impiega questa variabile ad apparire.

CoDHUD.HUD.Time.Fadeout=Tempo di scomparsa
CoDHUD.HUD.Time.Fadeout.desc=Quanto tempo impiega questa variabile a scomparire.

# Scale
CoDHUD.HUD.Scale=Scala UI

CoDHUD.HUD.Scale.Enable=Moltiplicatore scala UI
CoDHUD.HUD.Scale.Enable.desc=Regola la scala degli elementi UI usati dal CoD HUD.\n\nUtile per risoluzioni basse o ultrawide.\n\n<color=255,255,100>Nota</color>: ricaricherà il menu quando applicato.\n\n<color=255,100,100>AVVERTENZA</color>: alcuni elementi potrebbero risultare fortemente disallineati se il valore è troppo alto o troppo basso.

# Scoreboard
CoDHUD.HUD.Scoreboard=Classifica

CoDHUD.HUD.Scoreboard.Enable=Abilita classifica
CoDHUD.HUD.Scoreboard.Enable.desc=Abilita la classifica. Mostra le fazioni attualmente occupate da tutti i giocatori.

# Score Counter
CoDHUD.HUD.Scorecounter=Contatore punteggio

CoDHUD.HUD.Scorecounter.Enable=Abilita contatore punteggio
CoDHUD.HUD.Scorecounter.Enable.desc=Abilita un timer del server, un'icona di fazione e i contatori di punteggio.\n\nAlcuni tipi di HUD non mostreranno l'icona di fazione.

# Medals
CoDHUD.HUD.Medals=Medaglie

CoDHUD.HUD.Medals.Enable=Abilita medaglie
CoDHUD.HUD.Medals.Enable.desc=Abilita le medaglie, ottenute eseguendo azioni come uccisioni rapide o colpi alla testa.\n\nNota: alcuni tipi di HUD hanno solo testo, altri testo e icone.

CoDHUD.HUD.Medals.Speedup=Più veloce se coda lunga
CoDHUD.HUD.Medals.Speedup.desc=Velocizza la coda delle medaglie se ce ne sono molte in attesa.\n\nA seconda del tipo di HUD, disabilita anche gli SFX se ci sono più di 3 medaglie in coda.

# Kill Feed
CoDHUD.HUD.Killfeed=Feed uccisioni

CoDHUD.HUD.Killfeed.Enable=Abilita feed uccisioni
CoDHUD.HUD.Killfeed.Enable.desc=Abilita il feed uccisioni.

# Minimap
CoDHUD.HUD.Minimap=Minimappa

CoDHUD.HUD.Minimap.Enable=Abilita minimappa
CoDHUD.HUD.Minimap.Enable.desc=Abilita la minimappa.

# Hitmarker
CoDHUD.HUD.Hitmarker=Indicatore colpo

CoDHUD.HUD.Hitmarker.Enable=Abilita indicatore colpo
CoDHUD.HUD.Hitmarker.Enable.desc=Abilita l'indicatore colpo e il suono associato.

# Weapon Info
CoDHUD.HUD.WeaponInfo=Info arma

CoDHUD.HUD.WeaponInfo.Enable=Abilita info arma
CoDHUD.HUD.WeaponInfo.Enable.desc=Abilita la scheda info arma con nome arma e munizioni.\n\nAlcuni HUD includono anche la bussola qui.

CoDHUD.HUD.WeaponPrompts.Enable=Abilita promemoria arma
CoDHUD.HUD.WeaponPrompts.Enable.desc=Abilita i promemoria dell'arma, come le notifiche di munizioni basse.

# XP Counter
CoDHUD.HUD.XP=Notifica XP

CoDHUD.HUD.XP.Enable=Abilita notifica XP
CoDHUD.HUD.XP.Enable.desc=Abilita le notifiche XP.

# Target ID / IFF
CoDHUD.HUD.IFF=Identifica amico o nemico

CoDHUD.HUD.IFF.Enable=Abilita IFF
CoDHUD.HUD.IFF.Enable.desc=Abilita un sistema "Identifica amico o nemico", mostrando il nome del bersaglio sopra la testa quando lo si mira.

# Death Icon
CoDHUD.HUD.DeathIcon=Icona morte

CoDHUD.HUD.DeathIcon.Enable=Abilita icona morte
CoDHUD.HUD.DeathIcon.Enable.desc=Abilita l'icona morte mostrata quando un giocatore della stessa fazione muore.

# Chat
CoDHUD.HUD.Chat=Chat

CoDHUD.HUD.Chat.Enable=Abilita chat
CoDHUD.HUD.Chat.Enable.desc=Abilita la chat.

# Headers
CoDHUD.HUD.Headers=Intestazioni

CoDHUD.HUD.Headers.Enable=Abilita notifiche intestazione
CoDHUD.HUD.Headers.Enable.desc=Abilita notifiche di intestazione, come completamento sfide o avanzamento di livello.

# Subtitles
CoDHUD.HUD.Subtitles=Sottotitoli

CoDHUD.HUD.Subtitles.Enable=Abilita sottotitoli
CoDHUD.HUD.Subtitles.Enable.desc=Abilita i sottotitoli quando viene riprodotta una linea vocale del commentatore.\n\n<color=255,100,100>Avviso</color>: I sottotitoli vengono creati per le battute vocali in inglese.\n\n<color=255,255,100>Nota</color>: I sottotitoli tradotti non sono disponibili.

CoDHUD.HUD.Subtitles.Callsign=Abilita nominativo
CoDHUD.HUD.Subtitles.Callsign.desc=Abilita il nominativo del commentatore in riproduzione.

CoDHUD.HUD.Subtitles.NameAlign=Allineamento nominativo
CoDHUD.HUD.Subtitles.NameAlign.desc=Scegli dove posizionare il nominativo del commentatore.

CoDHUD.HUD.Subtitles.NameAlign.Left=A sinistra del testo
CoDHUD.HUD.Subtitles.NameAlign.Top=Sopra il testo

