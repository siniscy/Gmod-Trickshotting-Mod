# ---------[ FACTION-RELATED ]---------
CoDHUD.Faction.Select=Selezione fazione
CoDHUD.Faction.Select.desc=Scegli quale fazione rappresentare.\nInfluisce sul tuo stato amico/nemico e cambia il narratore e il tema in base alla fazione.

CoDHUD.Faction.ChangeWarning=Attenzione!\nCambiare squadra avrà le seguenti conseguenze:\n- Il tuo punteggio verrà azzerato a 0.\n- Verrai ucciso e rinascerai.\n\nSei sicuro di voler cambiare fazione?

